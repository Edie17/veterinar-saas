name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  qa:
    name: Backend, frontend and browser QA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      - name: Check browser installation
        run: google-chrome --version

      - name: Full QA with isolated demo data
        run: npm run qa

      - name: Save QA reports and browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-results
          retention-days: 7
          include-hidden-files: true
          path: |
            .qa/latest.json
            .qa/*/result.json
            .qa/*/frontend.xml
            .qa/*/backend/*.trx
            .qa/*/browser/*.trx
            .qa/*/browser/*.png
            .qa/*/browser/*.html

      - name: Dependency audit
        working-directory: client
        run: npm audit --audit-level=low

  container:
    name: Production container
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --pull -t veterinar-clinic:ci .
